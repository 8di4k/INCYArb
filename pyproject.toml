[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incyarb"
version = "0.1.0"
description = "Read-only Ink subblock observer"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "eth-abi>=5.0",
  "eth-utils>=4.0",
  "eth-hash[pycryptodome]>=0.7",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incy_arb = ["artifacts/*.json"]
